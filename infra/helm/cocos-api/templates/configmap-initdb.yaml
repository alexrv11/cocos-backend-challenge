{{- if .Values.initMigration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-initdb
  labels:
    {{- include "cocos-api.labels" . | nindent 4 }}
data:
  000_schema.sql: |
{{ .Files.Get "files/000_schema.sql" | indent 4 }}
  001_seed.sql: |
{{ .Files.Get (printf "files/seeds/%s/001_seed.sql" .Values.initMigration.seedProfile) | indent 4 }}
{{- end }}
