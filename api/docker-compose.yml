services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-cocos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cocos123}
      POSTGRES_DB: ${DB_NAME:-cocosdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cocos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cocos}
      DB_PASSWORD: ${DB_PASSWORD:-cocos123}
      DB_NAME: ${DB_NAME:-cocosdb}
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
