services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos123
      POSTGRES_DB: cocosdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000_schema.sql:/docker-entrypoint-initdb.d/000_schema.sql
      - ./migrations/seeds/dev/001_seed.sql:/docker-entrypoint-initdb.d/001_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: cocos
      DB_PASSWORD: cocos123
      DB_NAME: cocosdb
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
